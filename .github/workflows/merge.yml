# Thin caller: the merge gate lives in gantry. Renovate bumps the gantry SHA.
# Runs on commit status changes; merges only when the merge-gate App approved.
# Variable: MERGE_GATE_CLIENT_ID. Secret: MERGE_GATE_PRIVATE_KEY.
name: merge
# `merge: ai-review success on <branch>`. The branch comes from the status event's
# `branches` list; the full SHA is the fallback, as expressions cannot shorten it.
run-name: >-
  merge: ${{ github.event.context }} ${{ github.event.state }}
  on ${{ github.event.branches[0].name || github.event.sha }}

on:
  status:

permissions: {}

concurrency:
  group: merge-${{ github.event.sha }}
  cancel-in-progress: false

jobs:
  merge:
    uses: bartromgens/gantry/.github/workflows/merge.yml@17a82b295817b855958ecf01135ef7af6d2f228d # main
    permissions:
      id-token: write
    with:
      merge_gate_client_id: ${{ vars.MERGE_GATE_CLIENT_ID }}
    secrets:
      MERGE_GATE_PRIVATE_KEY: ${{ secrets.MERGE_GATE_PRIVATE_KEY }}
