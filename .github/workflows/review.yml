# Thin caller: the AI review lives in gantry. Renovate bumps the gantry SHA.
# Runs after CI succeeds on a PR.
# Variable: MERGE_GATE_CLIENT_ID. Secrets: CLAUDE_CODE_OAUTH_TOKEN (or ANTHROPIC_API_KEY),
# MERGE_GATE_PRIVATE_KEY.
name: review

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions: {}

concurrency:
  group: review-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  review:
    uses: bartromgens/gantry/.github/workflows/review.yml@1b099d5c7a612f9d32ca8d121ef8bc3411ee5423 # main
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
      id-token: write
    with:
      merge_gate_client_id: ${{ vars.MERGE_GATE_CLIENT_ID }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      MERGE_GATE_PRIVATE_KEY: ${{ secrets.MERGE_GATE_PRIVATE_KEY }}
