# Thin caller: the AI review lives in gantry. Renovate bumps the gantry SHA.
# Runs after CI finishes on a PR: the review when CI succeeded, a repair attempt when it
# failed. Also runs on a push to main, to repair agent PRs that no longer merge cleanly.
# Variable: MERGE_GATE_CLIENT_ID. Secrets: CLAUDE_CODE_OAUTH_TOKEN (or ANTHROPIC_API_KEY),
# MERGE_GATE_PRIVATE_KEY.
name: review
# After CI: `review: PR #7 <title>`, or `review: <branch> <title>` when the run carries no PR
# (a fork). A push to the default branch is the repair sweep. Expressions cannot cut a
# commit message to its first line or a SHA to seven characters, so the sweep is named by branch.
run-name: >-
  review: ${{ github.event_name == 'push'
  && format('repair sweep after push to {0}', github.ref_name)
  || github.event.workflow_run.pull_requests[0].number
  && format('PR #{0} {1}', github.event.workflow_run.pull_requests[0].number, github.event.workflow_run.display_title)
  || format('{0} {1}', github.event.workflow_run.head_branch, github.event.workflow_run.display_title) }}

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: review-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  review:
    uses: bartromgens/gantry/.github/workflows/review.yml@17a82b295817b855958ecf01135ef7af6d2f228d # main
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
      id-token: write
    with:
      merge_gate_client_id: ${{ vars.MERGE_GATE_CLIENT_ID }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      MERGE_GATE_PRIVATE_KEY: ${{ secrets.MERGE_GATE_PRIVATE_KEY }}
