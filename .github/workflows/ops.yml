# Thin caller: allowlisted operations live in gantry. Renovate bumps the gantry SHA.
name: ops
run-name: 'ops: ${{ inputs.action }}'

on:
  workflow_dispatch:
    inputs:
      action:
        description: Operation to run
        type: choice
        options: [restart, prune-images]

permissions: {}

jobs:
  ops:
    uses: bartromgens/gantry/.github/workflows/ops.yml@17a82b295817b855958ecf01135ef7af6d2f228d # main
    permissions:
      contents: read
    with:
      action: ${{ inputs.action }}
      host: ${{ vars.DEPLOY_HOST }}
      known_hosts: ${{ vars.DEPLOY_KNOWN_HOSTS }}
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
