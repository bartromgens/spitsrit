# Thin caller: allowlisted operations live in gantry. Renovate bumps the gantry SHA.
name: ops

on:
  workflow_dispatch:
    inputs:
      action:
        description: Operation to run
        type: choice
        options: [restart, prune-images]

permissions: {}

jobs:
  ops:
    uses: bartromgens/gantry/.github/workflows/ops.yml@a43cbf0da98b92787862ddb154e09237e582fd35 # main
    permissions:
      contents: read
    with:
      action: ${{ inputs.action }}
      host: ${{ vars.DEPLOY_HOST }}
      known_hosts: ${{ vars.DEPLOY_KNOWN_HOSTS }}
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
