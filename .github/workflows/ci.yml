# Thin caller: CI lives in gantry. Renovate bumps the gantry SHA.
name: ci

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: bartromgens/gantry/.github/workflows/ci.yml@49b6f40ffc1a8b4d1dc225ba3b968e940669cc8a # main
    permissions:
      contents: read
