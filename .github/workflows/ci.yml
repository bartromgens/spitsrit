# Thin caller: CI lives in gantry. Renovate bumps the gantry SHA.
name: ci

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: bartromgens/gantry/.github/workflows/ci.yml@d46f7ebe0ef53c0e29ec1247f9d3f281b54c0187 # main
    permissions:
      contents: read
