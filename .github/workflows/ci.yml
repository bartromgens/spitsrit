# Thin caller: CI lives in gantry. Renovate bumps the gantry SHA.
name: ci

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: bartromgens/gantry/.github/workflows/ci.yml@17a82b295817b855958ecf01135ef7af6d2f228d # main
    permissions:
      contents: read
