# Thin caller: CI lives in gantry. Renovate bumps the gantry SHA.
name: ci

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: bartromgens/gantry/.github/workflows/ci.yml@a43cbf0da98b92787862ddb154e09237e582fd35 # main
    permissions:
      contents: read
