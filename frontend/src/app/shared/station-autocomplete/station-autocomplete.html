<mat-form-field [subscriptSizing]="subscriptSizing()">
  <mat-label>{{ label() }}</mat-label>
  <input matInput [formControl]="control()" [matAutocomplete]="auto" />
  <mat-autocomplete #auto (optionSelected)="optionSelected.emit($event)">
    @for (station of options(); track station.code) {
      <mat-option [value]="station">{{ station.name }}</mat-option>
    }
  </mat-autocomplete>
</mat-form-field>
