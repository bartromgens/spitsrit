<span class="carriages" role="img" [class.multi]="shown().length > 1" [attr.aria-label]="label()">
  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <rect
      x="2"
      y="4"
      width="20"
      height="13"
      rx="3"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    />
    <path d="M2 11h20" stroke="currentColor" stroke-width="2" />
    <circle cx="7" cy="20" r="1.5" fill="currentColor" />
    <circle cx="17" cy="20" r="1.5" fill="currentColor" />
  </svg>
  <span class="counts" aria-hidden="true">
    @for (count of shown(); track $index) {
      @if (!$first) {
        <span class="arrow">→</span>
      }
      <span class="sp-mono count">{{ count || '?' }}</span>
    }
  </span>
</span>
