@if (seats()) {
  <span
    class="seats"
    role="img"
    [attr.aria-label]="(atLeast() ? 'at least ' : '') + seats() + ' seats'"
  >
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path
        d="M7 3h5a3 3 0 0 1 3 3v7h4a2 2 0 0 1 2 2v1H5V6a3 3 0 0 1 2-3zM7 19v2M17 19v2"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
    <span class="sp-mono" aria-hidden="true">{{ seats() }}</span>
  </span>
  @if (trainType()) {
    <span class="type">{{ trainType() }}</span>
  }
}
@if (shorterStock()) {
  <span
    class="shorter"
    [class.extra-busy]="shorterStock() === 'EXTRA_BUSY'"
    [attr.title]="shorterStockWarning() || 'Shorter train than usual'"
    [attr.aria-label]="shorterStockWarning() || 'Shorter train than usual'"
    role="img"
    >Shorter</span
  >
}
