@if (summary()) {
  <p class="summary" data-testid="ov-fiets-count">
    <app-facility-icon code="FIETS" />
    <span>{{ summary() }}</span>
  </p>
  @if (points().length > 0) {
    <ul class="points" aria-label="Per rental point">
      @for (point of points(); track $index) {
        <li [class.closed]="point.closed">
          <span class="name">{{ point.name }}</span>
          <span class="status" [class.sp-mono]="!point.closed">{{ point.status }}</span>
        </li>
      }
    </ul>
  }
}
