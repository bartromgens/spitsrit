<mat-toolbar>
  <button matIconButton class="menu-toggle" aria-label="Open menu" [matMenuTriggerFor]="mobileMenu">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true">
      <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
    </svg>
  </button>
  <span class="brand">Spitsrit</span>
  <nav class="nav" aria-label="Main">
    <a
      matButton
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      >Home</a
    >
    <a matButton routerLink="/commutes" routerLinkActive="active">Commutes</a>
  </nav>
  <span class="spacer"></span>
  @if (auth.user(); as user) {
    <span class="user">{{ user.username }}</span>
    <button matButton (click)="logout()">Log out</button>
  } @else {
    <a matButton routerLink="/register">Create account</a>
    <a matButton routerLink="/login">Log in</a>
  }
</mat-toolbar>
<mat-menu #mobileMenu="matMenu">
  <a mat-menu-item routerLink="/">Home</a>
  <a mat-menu-item routerLink="/commutes">Commutes</a>
</mat-menu>
<main>
  <router-outlet />
</main>
