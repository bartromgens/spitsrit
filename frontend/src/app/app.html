<mat-toolbar>
  <button matIconButton class="menu-toggle" aria-label="Open menu" [matMenuTriggerFor]="mobileMenu">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true">
      <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
    </svg>
  </button>
  <a class="brand" routerLink="/" aria-label="Spitsrit, home">Spitsrit</a>
  <nav class="nav" aria-label="Main">
    <a matButton routerLink="/commutes" routerLinkActive="active">Commutes</a>
  </nav>
  <span class="spacer"></span>
  @if (auth.user(); as user) {
    <button matButton class="user" data-testid="user-menu" [matMenuTriggerFor]="userMenu">
      {{ user.username }}
      <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M7 10l5 5 5-5z" fill="currentColor" />
      </svg>
    </button>
  } @else {
    <a matButton routerLink="/register">Create account</a>
    <a matButton routerLink="/login">Log in</a>
  }
</mat-toolbar>
<mat-menu #mobileMenu="matMenu">
  <a mat-menu-item routerLink="/commutes">Commutes</a>
</mat-menu>
<mat-menu #userMenu="matMenu" xPosition="before">
  <button mat-menu-item data-testid="logout" (click)="logout()">Log out</button>
</mat-menu>
<main>
  <router-outlet />
</main>
<footer>Not affiliated with NS</footer>
